name: forever-fds-plan20

services:
  fds-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: forever-fds-backend:plan20

    env_file:
      - ./backend/.env.docker.local

    environment:
      NODE_ENV: staging
      PORT: "4200"
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      RABBITMQ_ENABLED: "false"
      WKMS_INTEGRATION_ENABLED: "false"
      FDS_ALLOWED_ORIGINS: "http://127.0.0.1:3100,http://localhost:3100"

    ports:
      - "127.0.0.1:4200:4200"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4200/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    restart: "no"

  fds-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:4200"
        NEXT_PUBLIC_WS_URL: "http://127.0.0.1:4200"

    image: forever-fds-frontend:plan20

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    ports:
      - "127.0.0.1:3100:3000"

    depends_on:
      fds-backend:
        condition: service_healthy

    restart: "no"
