name: Front Desk release images
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml
  frontend:
    uses: ./.github/workflows/frontend-ci.yml
  containers:
    uses: ./.github/workflows/docker-ci.yml
  publish-images:
    name: Publish reviewed Front Desk images
    needs: [backend, frontend, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: write
    concurrency:
      group: fds-image-publication-develop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require peer approval on the merged PR's final code
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: context.sha, per_page: 100
            });
            const candidates = prs.filter(pr => pr.merged_at && pr.base.ref === 'develop' && pr.merge_commit_sha === context.sha);
            for (const pr of candidates) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
              const latest = new Map();
              for (const review of reviews) {
                if (review.user && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) latest.set(review.user.login, review);
              }
              const decisions = [...latest.values()];
              const approved = decisions.some(r => r.state === 'APPROVED' && r.commit_id === pr.head.sha && r.user.login !== pr.user.login);
              if (approved && !decisions.some(r => r.state === 'CHANGES_REQUESTED')) return;
            }
            throw new Error('Image publication requires a merged PR into develop with peer approval on its final head commit.');
      - name: Prepare temporary registry credentials and builder
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/fds-ghcr-auth"
          install -d -m 700 "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name fds-release --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Build and publish commit-tagged images
        env:
          PUBLIC_API_ORIGIN: https://forever-hotel-frontdesk.duckdns.org
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          for component in backend frontend; do
            image="ghcr.io/$repository/$component"
            args=()
            if [[ "$component" == frontend ]]; then
              args+=(--build-arg "NEXT_PUBLIC_API_BASE_URL=$PUBLIC_API_ORIGIN/fds" --build-arg "NEXT_PUBLIC_WS_URL=$PUBLIC_API_ORIGIN")
            fi
            docker buildx build --platform linux/amd64 --push \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$image:$GITHUB_SHA" \
              --metadata-file "$RUNNER_TEMP/fds-$component.json" \
              "${args[@]}" "$component"
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/fds-$component.json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s@%s\n' "$component" "$image" "$digest" >> "$RUNNER_TEMP/fds-images.txt"
          done
          jq -n --arg commit "$GITHUB_SHA" \
            --arg frontend "$(sed -n 's/^frontend=//p' "$RUNNER_TEMP/fds-images.txt")" \
            --arg backend "$(sed -n 's/^backend=//p' "$RUNNER_TEMP/fds-images.txt")" \
            '{commit: $commit, frontend: $frontend, backend: $backend}' > release-images.json
          {
            echo '### Published Front Desk images'
            echo '```json'
            cat release-images.json
            echo '```'
            echo 'Images published only. Azure deployment is a separate step.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: front-desk-release-images
          path: release-images.json
          if-no-files-found: error
      - name: Remove registry login
        if: always()
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/fds-ghcr-auth"
          docker logout ghcr.io || true
